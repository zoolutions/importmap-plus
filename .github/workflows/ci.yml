name: CI
# The command tests talk to live CDNs (jspm, jsDelivr). A push to a PR branch
# used to start a push run AND a pull_request run — two full matrices hitting
# the same endpoints at once — so run pushes only for main.
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        rails-version:
          - "6.1"
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"
          - "main"
        assets-pipeline:
          - sprockets
          - propshaft
        exclude:
          - rails-version: "6.1"
            assets-pipeline: "propshaft"
          - ruby-version: "3.1"
            rails-version: "8.0"
          - ruby-version: "3.1"
            rails-version: "8.1"
          - ruby-version: "3.1"
            rails-version: "main"
          - ruby-version: "3.2"
            rails-version: "main"
          - ruby-version: "4.0"
            rails-version: "6.1"
          - rails-version: "8.0"
            assets-pipeline: "sprockets"
          - rails-version: "8.1"
            assets-pipeline: "sprockets"
          - rails-version: "main"
            assets-pipeline: "sprockets"

    name: ${{ format('Tests (Ruby {0}, Rails {1}, {2})', matrix.ruby-version, matrix.rails-version, matrix.assets-pipeline) }}
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails-version }}_${{ matrix.assets-pipeline }}.gemfile
      ASSETS_PIPELINE: ${{ matrix.assets-pipeline }}

    steps:
      - uses: actions/checkout@v4

      - name: Remove Gemfile lock
        run: |
          rm -f $BUNDLE_GEMFILE.lock

      # bun is the minifier the --minify command tests reach for; without one
      # on the runner those tests skip and CI never exercises minification.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: |
          bundle exec rake
