# Only what conformance-kit holds this gem to: its thread-safety cops
# (inherited) and the frozen-string magic comment. Upstream (importmap-rails)
# has no RuboCop and upstream-owned files stay diff-minimal, so nothing else is
# turned on.
inherit_gem:
  conformance-kit: config/rubocop.yml

AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - "docs/**/*"          # the docs site, with its own RuboCop
    - "gemfiles/**/*"      # generated by Appraisal
    - "test/dummy/**/*"    # the Rails app the tests boot, not the gem
    - "vendor/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"
    # Copied verbatim into an app by `rails importmap:install`: the app's
    # files, not this gem's code.
    - "lib/install/bin/importmap"
    - "lib/install/config/importmap.rb"

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

# The blank line after it, as everywhere else in Ruby.
Layout/EmptyLineAfterMagicComment:
  Enabled: true

# These tests start threads on purpose: concurrent renders and reloads are
# what they test.
ThreadSafety/NewThread:
  Exclude:
    - "test/cache_as_contention_test.rb"
    - "test/map_reload_race_test.rb"
